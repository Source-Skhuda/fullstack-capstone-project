name: CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:

  lint_backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install backend deps
        run: |
          cd giftlink-backend
          npm ci
          npm install -g jshint

      - name: Run JSHint
        run: |
          cd giftlink-backend
          jshint .
          echo "Linted all the js files successfully"

  test_backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: lint_backend

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install backend deps
        run: |
          cd giftlink-backend
          npm ci

      - name: Run Mocha tests
        run: |
          cd giftlink-backend
          npm test

  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test_backend

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install & Build
        working-directory: giftlink-frontend
        run: |
          npm ci
          npm run build
          echo "Client-side build successfully"